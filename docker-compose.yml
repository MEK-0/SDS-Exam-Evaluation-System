services:
  postgres:
    image: postgres:16-alpine
    container_name: sds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sds}
      POSTGRES_USER: ${POSTGRES_USER:-sds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ayarlanmalıdır}
    ports:
      - "5432:5432"
    volumes:
      - sds-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sds-postgres-data:
